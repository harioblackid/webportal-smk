name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Production is MariaDB/MySQL (prd-02 §2), so CI runs the suite on the same
    # engine rather than on a stand-in.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: laravel_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_portal_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  e2e:
    # The name is load-bearing: deploy.yml looks up a check-run called
    # "browser tests" to decide whether to warn before releasing. Renaming this
    # job makes that lookup report "missing" on every release, forever, and a
    # warning that always fires is a warning nobody reads.
    name: browser tests
    runs-on: ubuntu-latest

    # Kept out of the `ci` job on purpose: lint and unit failures should come
    # back in a couple of minutes, not behind a browser matrix.
    #
    # Scope is deliberately narrow (`npm run test:e2e:ci`): the SEO suite, plus
    # smoke on Chrome and Safari. The rest — Firefox, the touch device, the
    # responsive sweep and the admin CRUD walk — runs locally.
    #
    # What that keeps is what only a real engine can see. seo.spec reads the HTML
    # the server sent, so it can prove SSR happened (FR6-1) but is blind to what
    # follows: a page can render perfectly on the server, pass all 25 SEO
    # assertions, and still throw during hydration and leave every visitor a
    # white screen. smoke.spec's `pageerror` and `console` listeners are the only
    # guard against that, which is why they are here and not left to a laptop.
    #
    # What it drops is what is covered more cheaply elsewhere. The admin walk is
    # 23 browser tests, and the Editor block that used to sit beside it is gone
    # altogether: its 20 assertions about response status — the FR5-2 / FR5-15a
    # 403 split included — are made by the 297 Pest tests in the `ci` job above,
    # in about a seventieth of the time.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: laravel_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_portal_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          # gd was here for the admin media specs, which push every upload
          # through ImageProcessor. Those run locally now, and no seeder touches
          # an image, so nothing in this job needs it.
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # Public media is served through public/storage; without the link every
      # image 404s and the image assertions fail for the wrong reason.
      - name: Link storage
        run: php artisan storage:link

      # FR6-1. `composer setup` only builds the client bundle, and a missing
      # bootstrap/ssr/ssr.js makes Inertia fall back to CSR silently.
      - name: Build SSR bundle
        run: npm run build:ssr

      # Accounts, jurusan, ekstrakurikuler, the identity record, and the site
      # settings — the same seeders a release runs. Still required now that the
      # admin specs (and the logins they needed) have left this job: seo.spec
      # asserts the sitemap advertises `/jurusan/`, and jurusan come from
      # SchoolContentSeeder.
      #
      # There is no content fixture. Specs that need berita, media, or a hero
      # detect the empty database and skip themselves (see tests/e2e/routes.ts).
      - name: Seed accounts, content and settings
        run: php artisan db:seed --force

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # .npmrc sets ignore-scripts=true, so the postinstall download never
        # runs — the browsers have to be fetched explicitly.
        #
        # Two engines, not four. The `seo` project needs none at all (it asserts
        # on raw HTML through the `request` fixture, never opening a page), and
        # smoke runs on Chrome and Safari — WebKit being the engine that has
        # actually produced faults here, and the one no Windows developer can
        # reach without Playwright.
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
