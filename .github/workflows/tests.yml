name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Production is MariaDB/MySQL (prd-02 §2), so CI runs the suite on the same
    # engine rather than on a stand-in.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: laravel_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_portal_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  e2e:
    name: browser tests
    runs-on: ubuntu-latest

    # Kept out of the `ci` job on purpose: lint and unit failures should come
    # back in a couple of minutes, not behind a browser matrix.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: laravel_portal_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_portal_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          # gd is not optional here: ImageProcessor resizes every demo photo
          # through it, and without it the fixture has no images at all.
          extensions: pdo_mysql, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      # Public media is served through public/storage; without the link every
      # image 404s and the image assertions fail for the wrong reason.
      - name: Link storage
        run: php artisan storage:link

      # FR6-1. `composer setup` only builds the client bundle, and a missing
      # bootstrap/ssr/ssr.js makes Inertia fall back to CSR silently.
      - name: Build SSR bundle
        run: npm run build:ssr

      - name: Cache demo photos
        uses: actions/cache@v4
        with:
          path: storage/app/private/demo-images
          key: demo-images-${{ hashFiles('app/Console/Commands/DemoImagesCommand.php') }}

      - name: Seed demo content
        run: |
          php artisan demo:images
          php artisan db:seed --class=DemoSeeder --force

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # .npmrc sets ignore-scripts=true, so the postinstall download never
        # runs — the browsers have to be fetched explicitly.
        run: npx playwright install --with-deps chromium firefox webkit msedge

      - name: Run browser tests
        run: npm run test:e2e

      - name: Measure Core Web Vitals
        # Separate step so timing is not sampled while the matrix above is
        # still competing for the runner's CPU.
        run: npm run test:e2e:perf

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
