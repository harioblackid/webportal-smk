; FR8-12 — the queue worker that runs image optimisation off the request cycle.
;
; Install as /etc/supervisor/conf.d/queue-worker.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; --max-time recycles the process hourly so a long-lived worker cannot hold a
; stale copy of the code or leak memory; `queue:restart` in the release script
; makes it pick up new code immediately.

;
; The PHP binary is pinned to a version on purpose. `php` on PATH is the
; system-wide update-alternatives symlink, which is not necessarily the version
; CloudPanel runs this site on — and a long-lived process started on the wrong
; one fails in ways that never show up during a release. Read the site's version
; from its FPM pool and match it here:
;
;   ls /etc/php/*/fpm/pool.d/<site-user>.conf
;   # /etc/php/8.3/fpm/pool.d/<site-user>.conf  ->  /usr/bin/php8.3
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/home/<site-user>/main-project
command=/usr/bin/php8.3 /home/<site-user>/main-project/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
user=<site-user>
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/home/<site-user>/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
