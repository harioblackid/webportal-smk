; FR8-11 / US-026 — the Inertia SSR renderer as a persistent, auto-restarting
; service. Without it every public page silently degrades to CSR and the whole
; prd-06 SEO spec stops holding.
;
; Install as /etc/supervisor/conf.d/inertia-ssr.conf, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Replace <site-user> and the paths with the real values (OQ8-5).

;
; The PHP binary is pinned to a version on purpose. `php` on PATH is the
; system-wide update-alternatives symlink, which is not necessarily the version
; CloudPanel runs this site on — and a long-lived process started on the wrong
; one fails in ways that never show up during a release. Read the site's version
; from its FPM pool and match it here:
;
;   ls /etc/php/*/fpm/pool.d/<site-user>.conf
;   # /etc/php/8.3/fpm/pool.d/<site-user>.conf  ->  /usr/bin/php8.3
[program:inertia-ssr]
process_name=%(program_name)s
directory=/home/<site-user>/main-project
command=/usr/bin/php8.3 /home/<site-user>/main-project/artisan inertia:start-ssr
user=<site-user>
autostart=true
autorestart=true
; The release script stops SSR deliberately; supervisor must always bring it
; back rather than treating a clean exit as "finished".
exitcodes=0,2
startsecs=3
startretries=10
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/<site-user>/logs/inertia-ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
